version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodplatform-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Jagan@1432}
      MYSQL_DATABASE: ${DB_NAME:-food_delivery_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foodplatform-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodplatform-backend
    restart: always
    environment:
      PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/food_delivery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Jagan@1432}
      JWT_SECRET: ${JWT_SECRET:-FoodPlatformSuperSecureProductionSecretKeyForSigning2026!}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - foodplatform-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodplatform-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - foodplatform-net

volumes:
  mysql_data:

networks:
  foodplatform-net:
    driver: bridge
