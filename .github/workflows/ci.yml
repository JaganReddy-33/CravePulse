name: CravePulse Full-Stack CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-verify:
    name: Backend Build, Test & Security Audit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: food_delivery_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Backend Depth Tests
        run: |
          cd backend
          mvn clean test
        env:
          DB_URL: jdbc:mysql://localhost:3306/food_delivery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
          DB_USER: root
          DB_PASSWORD: rootpassword
          JWT_SECRET: CravePulseProductionSecretKeyForJwtSigningMustBeVeryLong32Chars!

      - name: Package Backend WAR & Standalone Executable
        run: |
          cd backend
          mvn package -DskipTests

  frontend-test-and-build:
    name: Frontend Lint, Test & Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run Frontend Unit & Component Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build Vite Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Audit NPM Dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

  secrets-scan:
    name: Automated Secrets and Credentials Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
